<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact / About | AidSync</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">◆</div>
      <span>AidSync</span>
    </div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="contact-layout">
      <div class="contact-info">
        <span class="pill">Contact / About</span>
        <h1>Connecting Volunteers and NGOs across Karnataka</h1>
        <p>
          AidSync helps community teams organize urgent requests, coordinate
          volunteers, and keep response simple and visible.
        </p>

        <div class="info-list">
          <div class="info-item">📍 Karnataka, India</div>
          <div class="info-item">✉️ aidsync@gmail.com</div>
          <div class="info-item">⏱️ Real-time coordination</div>
        </div>
      </div>

      <form class="contact-card" id="contactForm">
        <h2>Contact Us</h2>

        <label>
          Name
          <input type="text" placeholder="Your name" required />
        </label>

        <label>
          Email
          <input type="email" placeholder="you@example.com" required />
        </label>

        <label>
          Message
          <textarea rows="5" placeholder="Write your message" required></textarea>
        </label>

        <button class="btn btn-primary btn-full" type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
