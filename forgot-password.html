<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | AidSync</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">◆</div>
      <span>AidSync</span>
    </div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
    </nav>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <div class="section-heading center">
        <h2>Reset Password</h2>
        <p>We will send a reset link to your email.</p>
      </div>

      <form class="auth-form" id="resetForm">
        <label>
          Email
          <input type="email" placeholder="you@example.com" required />
        </label>

        <button class="btn btn-primary btn-full" type="submit">Send Reset Link</button>

        <p class="small-text">
          Back to <a href="login.html">Login</a>
        </p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
